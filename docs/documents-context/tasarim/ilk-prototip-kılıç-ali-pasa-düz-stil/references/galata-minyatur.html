<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Galata Minyatürü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Marcellus+SC&display=swap">
<style>
/* Layout: yazma sayfası — kâğıt zemin, cetvelli çerçeve içinde canlı minyatür; altta başlık ve bölüm düğmeleri. Tek, bilinçli görünüm (kâğıt + altın). */
:root{
  --paper:#efe2c2;
  --paper-2:#f5ebd2;
  --ink:#2b1a10;
  --ink-soft:#6b5238;
  --gold:#c99a2e;
  --lapis:#1f4f8f;
  --vermilion:#b8432b;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-label:"Marcellus SC", "Cormorant Garamond", Georgia, serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);overflow:hidden}
#page{position:fixed;inset:0;padding:16px;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:14px;
  background:radial-gradient(120% 90% at 50% 40%,var(--paper-2),var(--paper) 70%)}
#frame{position:relative;min-height:0;border-radius:2px;
  box-shadow:0 0 0 1px var(--ink),0 0 0 4px var(--gold),0 0 0 5px var(--ink),0 0 0 9px var(--paper),0 0 0 10px var(--lapis),0 0 0 11px var(--ink);
  margin:11px;overflow:hidden;background:#e2bf62}
#sky{position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 42%,rgba(255,246,205,.38) 50%,transparent 58%) 0 0/300% 100%,
  linear-gradient(180deg,#b98a26 0%,#d8b04e 38%,#ecd28a 100%);animation:sheen 14s linear infinite}
@keyframes sheen{from{background-position:100% 0,0 0}to{background-position:-200% 0,0 0}}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.32}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(110,70,20,.32) 100%)}
.corner{position:absolute;width:34px;height:34px;pointer-events:none;z-index:3}
.corner.tl{left:-6px;top:-6px}.corner.tr{right:-6px;top:-6px;transform:scaleX(-1)}
.corner.bl{left:-6px;bottom:-6px;transform:scaleY(-1)}.corner.br{right:-6px;bottom:-6px;transform:scale(-1)}
#cap{position:absolute;left:50%;bottom:18px;transform:translate(-50%,0);text-align:center;padding:10px 26px 11px;width:max-content;min-width:min(420px,80%);box-sizing:border-box;max-width:calc(100% - 32px);
  background:var(--paper-2);box-shadow:0 0 0 1px var(--ink),0 0 0 3px var(--gold),0 0 0 4px var(--ink);transition:opacity .9s ease,transform .9s ease}
#cap.out{opacity:0;transform:translate(-50%,6px)}
#cap h2{margin:0;font-weight:600;font-style:italic;font-size:clamp(20px,2.4vw,28px);line-height:1.1;text-wrap:balance}
#cap p{margin:4px 0 0;font-size:clamp(14px,1.3vw,16px);color:var(--ink-soft);line-height:1.3;text-wrap:balance}
#bar{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding-inline:4px}
#title{display:grid;gap:1px;min-width:0}
#title b{font-family:var(--f-label);font-weight:400;font-size:17px;letter-spacing:.08em}
#title span{font-size:14px;color:var(--ink-soft);font-style:italic}
#ctrl{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
#chaps{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer}
.ch{flex:0 0 auto;font-family:var(--f-label);font-size:13px;letter-spacing:.05em;padding:5px 10px;border:1px solid var(--ink-soft);background:transparent;border-radius:2px;white-space:nowrap}
.ch:hover{background:rgba(201,154,46,.18)}
.ch[aria-current=true]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
#play{width:38px;height:34px;display:grid;place-items:center;border:1px solid var(--ink);background:var(--vermilion);color:var(--paper-2);border-radius:2px;flex:0 0 auto}
#play:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
#prog{position:absolute;left:0;top:0;height:3px;background:var(--vermilion);z-index:2;width:0}
.note{font-size:12.5px;color:var(--ink-soft);font-style:italic}
@media (max-width:720px){
  #page{padding:12px;gap:10px}
  #frame{margin:11px 11px 4px}
  #cap{bottom:12px;padding:8px 14px 9px}
  #title b{font-size:15px}
  .note{display:none}
  #ctrl{width:100%;flex-wrap:nowrap}
  #chaps{flex:1}
}
@media (prefers-reduced-motion:reduce){#sky{animation:none}#cap{transition:none}}
</style>

<div id="page">
  <div id="frame">
    <div id="sky"></div>
    <canvas id="c" aria-label="Minyatür üslubunda, 1580'lerin Galata ve Tophane kıyısı üzerinde süzülen bir kamera"></canvas>
    <canvas id="grain" aria-hidden="true"></canvas>
    <div id="vig"></div>
    <div id="prog"></div>
    <div id="cap" aria-live="polite"><h2 id="capT">Galata, 1580'ler</h2><p id="capS">Matrakçı Nasuh'un şehir minyatürlerinden esinlenen bir bakış</p></div>
    <svg class="corner tl" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 6h22M6 6v22" stroke="#2b1a10" stroke-width="1"/><circle cx="8" cy="8" r="6" fill="#c99a2e" stroke="#2b1a10"/><path d="M8 3.5c1.6 2 1.6 7 0 9M3.5 8c2-1.6 7-1.6 9 0" stroke="#b8432b" stroke-width="1.3" fill="none"/><circle cx="8" cy="8" r="1.4" fill="#1f4f8f"/></svg>
    <svg class="corner tr" viewBox="0 0 34 34" aria-hidden="true"><use href="#none"/><path d="M6 6h22M6 6v22" stroke="#2b1a10" stroke-width="1"/><circle cx="8" cy="8" r="6" fill="#c99a2e" stroke="#2b1a10"/><path d="M8 3.5c1.6 2 1.6 7 0 9M3.5 8c2-1.6 7-1.6 9 0" stroke="#b8432b" stroke-width="1.3" fill="none"/><circle cx="8" cy="8" r="1.4" fill="#1f4f8f"/></svg>
    <svg class="corner bl" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 6h22M6 6v22" stroke="#2b1a10" stroke-width="1"/><circle cx="8" cy="8" r="6" fill="#c99a2e" stroke="#2b1a10"/><path d="M8 3.5c1.6 2 1.6 7 0 9M3.5 8c2-1.6 7-1.6 9 0" stroke="#b8432b" stroke-width="1.3" fill="none"/><circle cx="8" cy="8" r="1.4" fill="#1f4f8f"/></svg>
    <svg class="corner br" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 6h22M6 6v22" stroke="#2b1a10" stroke-width="1"/><circle cx="8" cy="8" r="6" fill="#c99a2e" stroke="#2b1a10"/><path d="M8 3.5c1.6 2 1.6 7 0 9M3.5 8c2-1.6 7-1.6 9 0" stroke="#b8432b" stroke-width="1.3" fill="none"/><circle cx="8" cy="8" r="1.4" fill="#1f4f8f"/></svg>
  </div>
  <div id="bar">
    <div id="title"><b>Galata Minyatürü</b><span>Akar prototipi · stilize, yerler temsilî</span></div>
    <div id="ctrl">
      <div id="chaps" role="toolbar" aria-label="Bölümler"></div>
      <button id="play" type="button" aria-label="Duraklat"><svg width="14" height="14" viewBox="0 0 14 14" id="playIco"><rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/></svg></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(1580);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
function H(x,z){
  if(z>2.2) return -2.5;
  if(z>-2.5) return 0.5;
  const d=-z-2.5;
  let h=Math.min(13,d*0.3)+5*Math.exp(-((x+6)*(x+6)+(z+33)*(z+33))/260);
  h+=0.35*Math.sin(x*.21)*Math.cos(z*.19);
  const edge=1-smooth(70,100,Math.abs(x));
  return 0.5+Math.max(0,h)*edge*smooth(-2.5,-5.5,z);
}

// ---------- renderer ----------
const frameEl=document.getElementById('frame'), canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.5,1200);
scene.add(new THREE.AmbientLight(0xffffff,.55));
const dl=new THREE.DirectionalLight(0xffffff,.62); dl.position.set(-40,80,60); scene.add(dl);

const grad=new THREE.DataTexture(new Uint8Array([165,165,165,255,255,255]),2,1,THREE.RGBFormat);
grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.generateMipmaps=false; grad.needsUpdate=true;
const matCache={};
function toon(hex){return matCache[hex]||(matCache[hex]=new THREE.MeshToonMaterial({color:hex,gradientMap:grad}))}
const vToon=new THREE.MeshToonMaterial({vertexColors:true,gradientMap:grad});
const inkMat=new THREE.LineBasicMaterial({color:0x2b1a10});
const inkSoft=new THREE.LineBasicMaterial({color:0x2b1a10,transparent:true,opacity:.55});
function ink(mesh,th,m){const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,th||35),m||inkMat);mesh.add(e);return mesh}

// merge helper (vertex-coloured)
function Acc(){return {p:[],n:[],c:[]}}
const _col=new THREE.Color(), _m=new THREE.Matrix4(), _q=new THREE.Quaternion(), _s=new THREE.Vector3(), _v=new THREE.Vector3(), UP=new THREE.Vector3(0,1,0);
function push(acc,geo,pos,rotY,scale,hex){
  const g=geo.index?geo.toNonIndexed():geo.clone();
  _q.setFromAxisAngle(UP,rotY||0); _m.compose(pos,_q,scale||_s.set(1,1,1)); g.applyMatrix4(_m);
  const P=g.attributes.position.array,N=g.attributes.normal.array; _col.set(hex);
  for(let i=0;i<P.length;i++){acc.p.push(P[i]);acc.n.push(N[i])}
  for(let i=0;i<P.length/3;i++){acc.c.push(_col.r,_col.g,_col.b)}
}
function build(acc,edges,th){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(acc.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(acc.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(acc.c,3));
  const m=new THREE.Mesh(g,vToon); scene.add(m);
  if(edges) scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,th||30),edges));
  return m;
}

// ---------- ground ----------
const tg=new THREE.PlaneGeometry(240,120,96,48); tg.rotateX(-Math.PI/2); tg.translate(0,0,-50);
{const p=tg.attributes.position, cols=[];
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,H(x,z));
  if(z>-2.8){_col.set('#e7d6ad')} else {const band=Math.sin(z*.55+Math.sin(x*.08)*1.6); _col.set(band>.55?'#a9b772':'#9aae68')}
  cols.push(_col.r,_col.g,_col.b)}
 tg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); tg.computeVertexNormals();}
scene.add(new THREE.Mesh(tg,new THREE.MeshBasicMaterial({vertexColors:true})));
// quay line
{const q=new THREE.Mesh(new THREE.BoxGeometry(200,.9,.7),toon('#d8c49a'));q.position.set(0,.15,2.3);scene.add(ink(q,20))}

// ---------- water (fish-scale waves) ----------
const waterU={t:{value:0}};
const water=new THREE.Mesh(new THREE.PlaneGeometry(700,260,1,1),new THREE.ShaderMaterial({uniforms:waterU,
  vertexShader:'varying vec2 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`varying vec2 vW;uniform float t;
  void main(){
    vec2 p=vW*vec2(.34,.5); float row=floor(p.y); p.x+=row*.5+t*.12*(mod(row,2.)*2.-1.);
    vec2 f=fract(p)-vec2(.5,.15); float d=length(f*vec2(1.,1.25));
    float arc=smoothstep(.47,.43,d)-smoothstep(.39,.35,d); arc*=step(0.,f.y);
    vec3 base=mix(vec3(.16,.31,.58),vec3(.12,.24,.47),smoothstep(0.,120.,vW.y));
    vec3 c=mix(base,vec3(.70,.80,.92),arc*.85);
    float shore=smoothstep(6.,2.4,vW.y); c=mix(c,vec3(.55,.68,.84),shore*.35);
    gl_FragColor=vec4(c,1.);
  }`}));
water.rotation.x=-Math.PI/2; water.position.set(0,-.05,130); scene.add(water);

// ---------- Galata walls ----------
const WALL=[[-26,-1.6],[-24,-12],[-16,-25],[-6,-36],[5,-27],[11,-14],[13,-1.6],[-26,-1.6]];
function inWalls(x,z){let c=false;for(let i=0,j=WALL.length-2;i<WALL.length-1;j=i++){const [xi,zi]=WALL[i],[xj,zj]=WALL[j];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c}return c}
function distWall(x,z){let m=1e9;for(let i=0;i<WALL.length-1;i++){const [ax,az]=WALL[i],[bx,bz]=WALL[i+1];const dx=bx-ax,dz=bz-az;const t=clamp(((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz),0,1);m=Math.min(m,Math.hypot(x-(ax+t*dx),z-(az+t*dz)))}return m}
{const acc=Acc(), bx=new THREE.BoxGeometry(1,1,1); bx.translate(0,.5,0);
 for(let i=0;i<WALL.length-1;i++){
  const [ax,az]=WALL[i],[bx2,bz]=WALL[i+1], len=Math.hypot(bx2-ax,bz-az), n=Math.ceil(len/1.8), ang=-Math.atan2(bz-az,bx2-ax);
  for(let k=0;k<n;k++){const t=(k+.5)/n, x=ax+(bx2-ax)*t, z=az+(bz-az)*t, y=H(x,z)-.6;
   push(acc,bx,_v.set(x,y,z),ang,new THREE.Vector3(len/n+.05,3.4,.9),'#d9c7a1');
   if(k%2===0) push(acc,bx,_v.set(x,y+3.4,z),ang,new THREE.Vector3(.8,.7,.95),'#d9c7a1');}
  const y0=H(ax,az)-.6; push(acc,bx,_v.set(ax,y0,az),0,new THREE.Vector3(2.6,5.2,2.6),'#cdb88e');
  push(acc,new THREE.ConeGeometry(1.95,1.8,4).rotateY(Math.PI/4).translate(0,.9,0),_v.set(ax,y0+5.2,az),0,null,'#b8432b');
 }
 build(acc,inkMat,25);}

// ---------- landmarks ----------
const C={stone:'#efe6d2',lead:'#7f93b3',slate:'#566a8f',gold:'#d6a633',tower:'#d8c49c',roof:'#b8432b'};
function M(geo,hex,x,y,z,th){const m=new THREE.Mesh(geo,toon(hex));m.position.set(x,y,z);return ink(m,th)}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const DOME=r=>new THREE.SphereGeometry(r,16,8,0,Math.PI*2,0,Math.PI/2);
function alem(g,x,y,z){g.add(M(new THREE.CylinderGeometry(.06,.06,1,5),C.gold,x,y+.5,z,80));g.add(M(new THREE.SphereGeometry(.22,8,6),C.gold,x,y+1.05,z,80))}
function mosque(o){
  const g=new THREE.Group(), w=o.w, h=o.h, r=w*.36;
  g.add(M(B(w,h,w*.95),C.stone,0,h/2,0));
  g.add(M(B(w*.92,h*.55,w*.5),C.stone,0,h*.275,w*.72));
  for(let i=0;i<5;i++) g.add(M(DOME(w*.085),C.lead,(i-2)*w*.18,h*.55,w*.72,40));
  g.add(M(new THREE.CylinderGeometry(r,r,1.1,16),C.stone,0,h+.55,0,40));
  g.add(M(DOME(r),C.lead,0,h+1.1,0,40)); alem(g,0,h+1.1+r,0);
  if(o.side)[-1,1].forEach(s=>g.add(M(DOME(r*.5),C.lead,s*w*.38,h,0,40)));
  o.minarets.forEach(([mx,mz])=>{const mh=o.mh, mr=o.mr;
    g.add(M(B(mr*3.2,1.6,mr*3.2),C.stone,mx,.8,mz));
    g.add(M(new THREE.CylinderGeometry(mr,mr*1.1,mh,10),C.stone,mx,mh/2,mz,40));
    g.add(M(new THREE.CylinderGeometry(mr*1.9,mr*1.9,.24,10),C.stone,mx,mh*.78,mz,40));
    g.add(M(new THREE.ConeGeometry(mr*1.15,2.6,10),C.lead,mx,mh+1.3,mz,40)); alem(g,mx,mh+2.6,mz)});
  // avlu duvarı
  g.add(M(B(w*1.5,1.1,.35),C.stone,0,.55,w*1.25)); [-1,1].forEach(s=>g.add(M(B(.35,1.1,w*.9),C.stone,s*w*.75,.55,w*.8)));
  return g;
}
const LM={};
function place(g,x,z,key,rot){g.position.set(x,H(x,z)-.25,z);g.rotation.y=rot||0;scene.add(g);LM[key]={x,z,y:H(x,z)}}
place(mosque({w:9,h:4.3,minarets:[[5.5,-2.3]],mh:15.5,mr:.38,side:true}),31,-6.5,'kilicali');
place(mosque({w:7,h:3.8,minarets:[[4.3,-1.6]],mh:12.5,mr:.32}),-44,-6.5,'sokullu');
{const g=new THREE.Group(); g.add(M(B(9,2.6,5.5),C.stone,0,1.3,0)); g.add(M(DOME(2),C.lead,-1.8,2.6,0,40));
 [[1.6,-1.2],[1.6,1.2],[3.4,0]].forEach(([x,z])=>g.add(M(DOME(1.05),C.lead,x,2.6,z,40))); alem(g,-1.8,4.6,0); place(g,41.5,-4.5,'hamam');}
{const g=new THREE.Group();
 g.add(M(new THREE.CylinderGeometry(2.4,2.7,15,16),C.tower,0,7.5,0,40));
 for(let i=0;i<4;i++) g.add(M(B(.5,1.3,.12),'#3b2a1d',0,4+i*3,2.62,80));
 g.add(M(new THREE.CylinderGeometry(3,2.6,.9,16),C.tower,0,15.3,0,40));
 g.add(M(new THREE.CylinderGeometry(2.3,2.3,2.6,16),C.tower,0,17,0,40));
 g.add(M(new THREE.ConeGeometry(2.8,7,16),C.slate,0,21.8,0,40)); alem(g,0,25.3,0);
 place(g,-6,-35,'galata');}

// ---------- houses (with cumba) ----------
{const acc=Acc(), bx=new THREE.BoxGeometry(1,1,1); bx.translate(0,.5,0);
 const roof=new THREE.ConeGeometry(Math.SQRT1_2,1,4); roof.rotateY(Math.PI/4); roof.translate(0,.5,0);
 const WALLS=['#f3e6c8','#ebbfa6','#dcae70','#cfdcc3','#c3d0e6','#f0d9b5'], ROOFS=['#b8432b','#a9452f','#c1573a'];
 const houses=[]; let tries=0;
 while(houses.length<260&&tries<30000){tries++;
  const x=(rnd()*2-1)*82, z=-3.8-rnd()*50, inside=inWalls(x,z);
  if(!inside&&rnd()>.28) continue;
  if(distWall(x,z)<2.4) continue;
  if(Object.values(LM).some(l=>Math.hypot(l.x-x,l.z-z)<(l===LM.galata?5.5:l===LM.hamam?7:9.5))) continue;
  const w=2+rnd()*1.8, d=2+rnd()*1.6;
  if(houses.some(h=>Math.abs(h.x-x)<(h.w+w)/2+.5&&Math.abs(h.z-z)<(h.d+d)/2+.5)) continue;
  houses.push({x,z,w,d});
  const ry=(rnd()-.5)*.25, h=1.8+rnd()*1.4, base=Math.min(H(x-w/2,z-d/2),H(x+w/2,z+d/2),H(x-w/2,z+d/2),H(x+w/2,z-d/2))-.3;
  const wc=WALLS[Math.floor(rnd()*WALLS.length)];
  push(acc,bx,_v.set(x,base,z),ry,new THREE.Vector3(w,h,d),wc);
  let top=base+h;
  if(rnd()<.5){const h2=1.3+rnd()*.6; const off=new THREE.Vector3(0,0,.25).applyAxisAngle(UP,ry);
    push(acc,bx,_v.set(x+off.x,top,z+off.z),ry,new THREE.Vector3(w*1.04,h2,d*1.18),wc); top+=h2;}
  push(acc,roof,_v.set(x,top,z),ry,new THREE.Vector3(w*1.12,.9+rnd()*.6,d*1.22),ROOFS[Math.floor(rnd()*3)]);
 }
 build(acc,inkMat,30);}

// ---------- trees (servi + yuvarlak) ----------
{const acc=Acc(); const cyp=new THREE.ConeGeometry(.55,4.6,6); cyp.translate(0,2.3,0); const rnd2=new THREE.IcosahedronGeometry(1.3,0); rnd2.translate(0,2.3,0);
 const trunk=new THREE.CylinderGeometry(.14,.18,1.4,5); trunk.translate(0,.7,0);
 const spots=[];
 for(let i=0;i<22;i++) spots.push([22+rnd()*20,-12-rnd()*9,'c']); // Kılıç Ali hazire
 for(let i=0;i<14;i++) spots.push([-52+rnd()*16,-12-rnd()*8,'c']);
 for(let i=0;i<120;i++){const x=(rnd()*2-1)*90, z=-5-rnd()*55; if(inWalls(x,z)&&rnd()<.8) continue; spots.push([x,z,rnd()<.55?'c':'r'])}
 spots.forEach(([x,z,t])=>{ if(Object.values(LM).some(l=>Math.hypot(l.x-x,l.z-z)<(l===LM.galata?4:7))||distWall(x,z)<1.6) return;

const boats=[];
{const sail=new THREE.Shape(); sail.moveTo(0,0); sail.lineTo(0,3.2); sail.lineTo(2.2,.2); sail.lineTo(0,0);
 const sailG=new THREE.ShapeGeometry(sail);

// ---------- çintemani bulutları ----------
function cloudTex(seed){const r=mulberry32(seed), cv=document.createElement('canvas'); cv.width=512; cv.height=200; const x=cv.getContext('2d');
  const lobes=[]; let px=40; while(px<470){const rr=18+r()*22; lobes.push([px,110+Math.sin(px*.03+seed)*18-r()*10,rr]); px+=rr*1.1}
  x.lineJoin='round'; x.fillStyle='#f6f0e2'; x.strokeStyle='#26467f'; x.lineWidth=5;
  x.beginPath(); lobes.forEach(([a,b,c])=>{x.moveTo(a+c,b);x.arc(a,b,c,0,Math.PI*2)}); x.fill();
  lobes.forEach(([a,b,c])=>{x.beginPath();x.arc(a,b,c,Math.PI*1.05,Math.PI*1.95);x.stroke()});
  x.beginPath(); x.moveTo(lobes[0][0]-lobes[0][2],lobes[0][1]); x.bezierCurveTo(20,170,120,175,140,150); x.stroke();
  x.lineWidth=3; x.strokeStyle='#8fa6cf'; lobes.forEach(([a,b,c])=>{x.beginPath();x.arc(a,b+3,c*.55,Math.PI*1.15,Math.PI*1.85);x.stroke()});
  const t=new THREE.CanvasTexture(cv); return t}
const clouds=[];
for(let i=0;i<7;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex(i*7+3),transparent:true,depthWrite:false}));
  const sc=34+rnd()*22; s.scale.set(sc,sc*.39,1); s.position.set((rnd()*2-1)*150,58+rnd()*26,-110-rnd()*80); scene.add(s); clouds.push({s,sp:.8+rnd()*1.2})}

const cat=new THREE.Group();
{cat.add(M(B(2,.9,.95),'#f3e9da',0,1.1,0,20)); cat.add(M(B(1,.22,.97),'#e08a47',-.2,1.6,0,20));
 const hd=new THREE.Group(); hd.position.set(1.2,1.7,0); cat.add(hd);
 hd.add(M(B(.95,.82,.88),'#f3e9da',0,0,0,20)); [-1,1].forEach(s=>{const e=M(new THREE.ConeGeometry(.2,.46,4),s<0?'#e08a47':'#f3e9da',0,.62,s*.25,20);e.rotation.y=Math.PI/4;hd.add(e)});
 cat.legs=[]; [[.7,.3],[.7,-.3],[-.7,.3],[-.7,-.3]].forEach(([x,z])=>{const lg=new THREE.Group();lg.position.set(x,.8,z);lg.add(M(B(.26,.8,.26),'#f3e9da',0,-.4,0,20));cat.add(lg);cat.legs.push(lg)});
 const tl=M(new THREE.CylinderGeometry(.1,.13,1.2,6),'#e08a47',-1.05,1.8,0,60); tl.rotation.z=.6; cat.add(tl);
 cat.scale.setScalar(.8); cat.position.set(22,.5,.6); scene.add(cat);}

// ---------- camera path ----------
const KP=[ // position, target
 [[0,105,78],[0,6,-20]],
 [[-34,44,30],[-6,19,-34]],
 [[-2,27,4],[-6,21,-35]],
 [[20,9,24],[31,7,-6]],
 [[52,8,14],[33,6,-7]],
 [[-18,11,24],[-44,6,-7]],
 [[4,62,90],[0,6,-20]]];
const posC=new THREE.CatmullRomCurve3(KP.map(k=>new THREE.Vector3(...k[0])),true,'centripetal');
const tgtC=new THREE.CatmullRomCurve3(KP.map(k=>new THREE.Vector3(...k[1])),true,'centripetal');
const CHAPTERS=[
 {k:0, name:'Galata', t:"Galata, 1580'ler", s:"Matrakçı Nasuh'un şehir minyatürlerinden esinlenen bir bakış", a:-.06,b:.07},
 {k:1, name:'Kule ve surlar', t:'Galata Kulesi ve surlar', s:'Ceneviz yapısı; vakıf eseri değil ama siluetin kalbi', a:.1,b:.31},
 {k:3, name:'Kılıç Ali Paşa', t:'Kılıç Ali Paşa Külliyesi', s:'Mimar Sinan · o yıllarda deniz kıyısındaydı; yanında hamamı', a:.39,b:.61},
 {k:5, name:'Azapkapı', t:'Azapkapı Sokullu Mehmed Paşa Camii', s:'Mimar Sinan · Haliç kıyısında, yükseltilmiş taban üzerinde', a:.67,b:.78},
 {k:6, name:'Akar', t:'Her hayrat bir akarla yaşar', s:'Hamam ve dükkân gelirleri, çeşmeyi ve camiyi yüzyıllarca ayakta tuttu', a:.82,b:.95}];
const DUR=72; let u=0, playing=!reduceMotion, curCh=-1;
const chapsEl=document.getElementById('chaps');
CHAPTERS.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='ch';b.textContent=c.name;b.addEventListener('click',()=>{u=c.k/KP.length+(i===0?0:.001);showCh(i,true)});chapsEl.appendChild(b);c.btn=b});
const capEl=document.getElementById('cap'), capT=document.getElementById('capT'), capS=document.getElementById('capS');
let capTimer=0;
function showCh(i,instant){
  if(i===curCh) return; curCh=i;
  CHAPTERS.forEach((c,j)=>c.btn.setAttribute('aria-current',j===i?'true':'false'));
  if(i<0){capEl.classList.add('out');return}
  const c=CHAPTERS[i];
  clearTimeout(capTimer); capEl.classList.add('out');
  capTimer=setTimeout(()=>{capT.textContent=c.t;capS.textContent=c.s;capEl.classList.remove('out')},instant?0:700);
}
function chapterAt(u){for(let i=0;i<CHAPTERS.length;i++){const c=CHAPTERS[i];let x=u; if(c.a<0&&x>.9)x-=1; if(x>=c.a&&x<=c.b) return i} return -1}
const playBtn=document.getElementById('play'), ico=document.getElementById('playIco');
function setPlay(p){playing=p;playBtn.setAttribute('aria-label',p?'Duraklat':'Oynat');ico.innerHTML=p?'<rect x="2" y="1" width="3.5" height="12" fill="currentColor"/><rect x="8.5" y="1" width="3.5" height="12" fill="currentColor"/>':'<path d="M3 1l10 6-10 6z" fill="currentColor"/>'}
playBtn.addEventListener('click',()=>setPlay(!playing)); setPlay(playing);
CHAPTERS[0].btn.setAttribute('aria-current','true'); curCh=0;

// grain
{const g=document.getElementById('grain'), x=g.getContext('2d'); g.width=256; g.height=256; const im=x.createImageData(256,256);
 for(let i=0;i<im.data.length;i+=4){const v=200+Math.random()*55|0; im.data[i]=v; im.data[i+1]=v-8; im.data[i+2]=v-26; im.data[i+3]=255}
 x.putImageData(im,0,0); g.style.width='100%'; g.style.height='100%'; g.style.imageRendering='auto';
 const url=g.toDataURL(); g.style.display='none'; const d=document.createElement('div'); d.id='paper'; d.style.cssText='position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.34;background:url('+url+') repeat;background-size:256px'; frameEl.insertBefore(d,document.getElementById('vig'));}

function resize(){const r=frameEl.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.fov=r.width<r.height?52:36;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(frameEl); resize();

const prog=document.getElementById('prog'), P=new THREE.Vector3(), Tg=new THREE.Vector3();
let last=performance.now(), T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  if(playing){u=(u+dt/DUR)%1}
  posC.getPoint(u,P); tgtC.getPoint(u,Tg);
  if(!reduceMotion){P.x+=Math.sin(T*.5)*.35; P.y+=Math.sin(T*.37)*.25}
  camera.position.copy(P); camera.lookAt(Tg);
  prog.style.width=(u*100).toFixed(2)+'%';
  showCh(chapterAt(u));
  waterU.t.value=reduceMotion?0:T;
  if(!reduceMotion){
    boats.forEach(b=>{b.g.position.x+=b.dir*b.sp*dt; if(b.g.position.x>130)b.g.position.x=-130; if(b.g.position.x<-130)b.g.position.x=130; b.g.position.y=Math.sin(T*1.6+b.ph)*.12; b.g.rotation.z=Math.sin(T*1.2+b.ph)*.04});
    clouds.forEach(c=>{c.s.position.x+=c.sp*dt; if(c.s.position.x>170)c.s.position.x=-170});
    const cx=22+ (Math.sin(T*.12)*.5+.5)*16, dx=cx-cat.position.x; cat.position.x=cx; cat.rotation.y=dx>=0?0:Math.PI;
    cat.legs.forEach((l,i)=>l.rotation.z=Math.sin(T*7+(i===0||i===3?0:Math.PI))*.5);
  }
  gulls.forEach(g=>{ if(!reduceMotion) g.a+=g.sp*dt; const x=g.cx+Math.cos(g.a)*g.r, z=g.cz+Math.sin(g.a)*g.r*.5, y=g.y+Math.sin(g.a*2)*1.2;
    const flap=Math.sin(T*g.f)*.45, s=.9, p=g.l.geometry.attributes.position.array;
    const hx=-Math.sin(g.a), hz=Math.cos(g.a)*.5, n=Math.hypot(hx,hz)||1, px=-hz/n, pz=hx/n;
    p[0]=x+px*s; p[1]=y+flap; p[2]=z+pz*s; p[3]=x; p[4]=y-.25; p[5]=z; p[6]=x-px*s; p[7]=y+flap; p[8]=z-pz*s;
    g.l.geometry.attributes.position.needsUpdate=true});
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
