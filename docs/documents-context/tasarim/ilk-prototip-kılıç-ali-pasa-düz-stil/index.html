<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f3d5b3">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f7a76'/%3E%3Cpath d='M8 23h16M10 23v-5h12v5M11 18a5 5 0 0 1 10 0M16 13V8' stroke='%23fdf3e4' stroke-width='1.8' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='7' r='1.4' fill='%23dcaa3f'/%3E%3C/svg%3E">
  <title>Vakıf Haritası · Tophane</title>
  <meta name="description" content="Tophane'de üç vakıf eseri: resimli harita, Kılıç Ali Paşa Camii ve Tophane Çeşmesi'nin 3B canlandırması.">
</head>
<body>
  <div id="map" aria-label="Tophane ve Karaköy haritası"></div>

  <header id="progress" aria-live="polite">
    <div class="prog-row">
      <span class="prog-title">Tophane Vakıf Yürüyüşü</span>
      <span class="prog-count" id="progCount">1 / 3</span>
    </div>
    <div class="prog-bar" id="progBar" role="progressbar" aria-label="Rota ilerlemesi" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1"></div>
  </header>

  <section id="card" aria-live="polite">
    <button class="icon-btn card-nav" id="prevStop" type="button" aria-label="Önceki durak"></button>
    <button class="card-body" id="cardBody" type="button">
      <span class="card-num" id="cardNum">1</span>
      <span class="card-text">
        <b id="cardTitle"></b>
        <span class="card-sub"><span id="cardSub"></span><span class="chip t-rep" id="cardTag">Temsili canlandırma</span><span class="card-cta" id="cardCta"></span></span>
      </span>
    </button>
    <button class="icon-btn card-nav" id="nextStop" type="button" aria-label="Sonraki durak"></button>
  </section>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
