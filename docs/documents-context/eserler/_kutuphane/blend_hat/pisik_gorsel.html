const display = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const sample = new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
for (const r of [display,sample]) { r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; } document.body.appendChild(display.domElement);

// taban: ana parçanın yatay ortası, en alt nokta y = 0 (model-anchor.ts modelBase gibi); Harita_Golge tabana katılmaz
function taban(m, ana) {
  m.updateMatrixWorld(true); const parts = new THREE.Box3();
  m.traverse(o => { if (o.isMesh && o.name !== 'Harita_Golge') parts.expandByObject(o); });
  const a = ana && m.getObjectByName(ana); const c = (a ? new THREE.Box3().setFromObject(a) : parts).getCenter(new THREE.Vector3());

window.ciz = async ({ dosya, ref, pisik, tema, kamAz, gunesAz, ana, kamEgim = 45, yakin = false, iskeletsiz = false, ornek = false, uv = false, maske = false }) => {
  const r = ornek || uv ? sample : display;

  const L = IS[tema]; r.toneMappingExposure = L.exposure; r.toneMapping = (maske || uv || ornek) ? THREE.NoToneMapping : THREE.ACESFilmicToneMapping;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(maske ? 0x000000 : (tema === 'gece' ? 0x1d2533 : 0xe9e5dc));
  const m = (await yukle(dosya)).clone(true);

    m.traverse(o => {

      o.visible = o.name !== 'Harita_Golge';
      const text = o.material.name.startsWith('Mahya_Yazi');
      const b = new THREE.MeshBasicMaterial({color:0xffffff, map:text ? o.material.map : null, transparent:text, side:o.material.side});
      b.onBeforeCompile = shader => {

    const delta = centre(await yukle(ref)).sub(centre(await yukle(dosya)));

      vertexShader: 'varying vec2 coords; void main(){coords=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
      fragmentShader: 'varying vec2 coords; void main(){vec2 p=floor(clamp(coords,0.,0.999999)*2048.); gl_FragColor=vec4(floor(p/8.),mod(p.x,8.)+8.*mod(p.y,8.),255.)/255.;}'

// 4 Kasım 2026: uygulamanın telefondaki harita görünümü (apps/web/src/lib/map-models.ts + scene-light.ts addMapLights/aimMapSun).
// MapLibre tuvali kenar yumuşatmasız (canvasContextAttributes verilmiyor), piksel oranı 2: 390 × 844 CSS = 780 × 1688.
// Işıklı dosya: yarımküre + güneş, 1024 gölge haritası, yarıçap = kutu köşegeni × 0,65, ShadowMaterial zemin. Bütün malzemeleri
// ışıksız dosya (gece modeli, pişmiş dosya) isBaked: gölgesiz. Kamera: dikey 36,87° (MapLibre), eğim 60°, hedefe uzaklık metre.
// maske: {dugum:[ad], malzeme?:[ad]} → seçilen parçalar beyaz, kalan bina siyah (örter), Harita_Golge yok.
const app = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
app.setPixelRatio(1); app.shadowMap.enabled = true; app.shadowMap.type = THREE.PCFShadowMap; app.outputColorSpace = THREE.SRGBColorSpace;
// map-models.ts load + place: ışıklı dosyada yarımküre, güneş (aimMapSun), gölge zemini; kutu bütün modelin
function haritaIsigi(sc, m, L, gunesAz, golgePx) {

  sc.add(new THREE.HemisphereLight(L.sky, L.ground, L.ambient));
  const s = new THREE.DirectionalLight(L.colour, L.sun); s.castShadow = true; s.shadow.mapSize.set(golgePx, golgePx); s.shadow.bias = -0.0004;
  const a = THREE.MathUtils.degToRad(gunesAz), e = THREE.MathUtils.degToRad(IS.gunduz.elevationDeg);
  s.position.set(Math.sin(a) * Math.cos(e), Math.sin(e), -Math.cos(a) * Math.cos(e)).multiplyScalar(radius * 2.5).add(centre);
  s.target.position.copy(centre); s.shadow.normalBias = radius / golgePx;

}
window.uygulama = async ({ dosya, ref, tema, hedef, kamAz, egim = 60, uzaklik = 440, gunesAz, ana, maske = null, W = 780, H = 1688, fov = 36.87, golgePx = 1024, doku = null, dokuUrl = null }) => {

  const sc = new THREE.Scene(); sc.background = new THREE.Color(maske ? 0x000000 : (tema === 'gece' ? 0x1d2533 : 0xe9e5dc));
  const m = (await yukle(dosya)).clone(true);

  if (dosya.endsWith('_sunum.glb')) {   // ciz() ile aynı: ana parça ortası haritadakine oturur, çevre gizli
    const centre = o => new THREE.Box3().setFromObject(o.getObjectByName(ana)).getCenter(new THREE.Vector3());
    m.position.add(centre(await yukle(ref)).sub(centre(await yukle(dosya))));

  if (doku) m.traverse(o => { const t = o.isMesh && o.material.map; if (!t || o.material.name !== 'Harita_Pisik') return; o.material = o.material.clone(); const u = t.clone();

    if (occ[4 * f + 3] > 0.25 && occ[4 * f + 3] < 0.75) {   // koru (Mahya): örneği varsa rengi 160 bayrağıyla verilir
      if (w[t] > 0) { for (let c = 0; c < 3; c++) rgb.data[o + c] = srgb(sum[3 * t + c] / w[t]); bay.data[o] = bay.data[o + 1] = bay.data[o + 2] = 160; }
      else bay.data[o] = bay.data[o + 1] = bay.data[o + 2] = 128; }
    else if (w[t] > 0) { for (let c = 0; c < 3; c++) rgb.data[o + c] = srgb(sum[3 * t + c] / w[t]); bay.data[o] = bay.data[o + 1] = bay.data[o + 2] = 255; ornek++; }
    else if (occ[4 * f + 3] > 0.5) { bay.data[o] = bay.data[o + 1] = bay.data[o + 2] = 64; adaBos++; }
  }
  g.putImageData(rgb, 0, 0); const rgbPng = cv.toDataURL('image/png'); g.putImageData(bay, 0, 0); const bayPng = cv.toDataURL('image/png');
  return { rgb: rgbPng, bayrak: bayPng, doseme, alinan_piksel: alinan, orneklenen_texel: ornek, ada_ornek_yok: adaBos };
};
// Mahya (gece): mevcut dosyada ışıksız, kendi dokusu (yazı, alfa) ve tel rengiyle çizilir. Pişmiş Mahya köşeleri konumla mevcuttakilere
// eşlenir (en yakın köşe, ≤ 5 cm), yeni UV uzayında eski UV'den doku okunur (three sRGB dokuyu GPU'da doğrusala çevirir); 16 alt-piksel kaydırmalı geçişin ortalaması (alfa ağırlıklı renk, ortalama alfa).
window.mahyaAktar = async ({ mevcut, pismis, kaynak = null }) => {   // kaynak: başka bir pişmiş dosyanın mahyası (atlas renk + alfa)
  if (kaynak) mevcut = kaynak;
  const N = 2048, bul = (root) => { const l = []; root.traverse(o => { if (o.isMesh) { let n = o; while (n && !/^Mahya/.test(n.name)) n = n.parent; if (n) l.push(o); } }); return l; };
  const eski = bul(await yukle(mevcut)), yeni = bul(await yukle(pismis));
  const anah = (p) => p.map(v => Math.round(v * 500)).join(',');
  const tablo = new Map();
  for (const o of eski) { const g = o.geometry, P = g.attributes.position, Uv = g.attributes.uv; o.updateMatrixWorld(true);
    const yazi = kaynak || /^Mahya_Yazi/.test(o.material.name), v = new THREE.Vector3();
    for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); tablo.set(tablo.size, [Uv ? Uv.getX(i) : 0, Uv ? Uv.getY(i) : 0, yazi ? 1 : 0, v.x, v.y, v.z]); } }
  const liste = [...tablo.values()]; let enUzak = 0;
  const yakin = (x, y, z) => { let b = null, bd = 0.05 ** 2; for (const t of liste) { const d = (t[3] - x) ** 2 + (t[4] - y) ** 2 + (t[5] - z) ** 2; if (d < bd) { bd = d; b = t; } } if (b) enUzak = Math.max(enUzak, Math.sqrt(bd)); return b; };
  const yazim = kaynak ? eski[0].material : eski.find(o => /^Mahya_Yazi/.test(o.material.name))?.material, telm = eski.find(o => !/^Mahya_Yazi/.test(o.material.name))?.material;
  const r = sample; r.setSize(N, N);
  const rt = new THREE.WebGLRenderTarget(N, N, { type: THREE.FloatType }); const sc = new THREE.Scene(); let eslesmeyen = 0, kose = 0;
  const jit = { value: new THREE.Vector2() };
  for (const o of yeni) { const g = o.geometry.clone(), P = g.attributes.position; o.updateMatrixWorld(true); const v = new THREE.Vector3();
    const eu = new Float32Array(2 * P.count), tur = new Float32Array(P.count);
    for (let i = 0; i < P.count; i++) { v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld); const t = yakin(v.x, v.y, v.z); kose++;
      if (!t) { eslesmeyen++; tur[i] = -1; continue; } eu[2 * i] = t[0]; eu[2 * i + 1] = t[1]; tur[i] = t[2]; }
    g.setAttribute('eskiUv', new THREE.BufferAttribute(eu, 2)); g.setAttribute('tur', new THREE.BufferAttribute(tur, 1));
    const m = new THREE.ShaderMaterial({ side: THREE.DoubleSide, glslVersion: THREE.GLSL3, depthTest: false, transparent: false,
      uniforms: { map: { value: yazim.map }, yf: { value: new THREE.Vector4(...yazim.color.toArray(), yazim.opacity) }, tf: { value: new THREE.Vector4(...(telm ? telm.color.toArray() : [0, 0, 0]), 1) }, jit },
      vertexShader: 'in vec2 eskiUv; in float tur; out vec2 vE; out float vT; uniform vec2 jit; void main(){ vE = eskiUv; vT = tur; gl_Position = vec4(uv * 2. - 1. + jit, 0., 1.); }',
      fragmentShader: 'in vec2 vE; in float vT; out vec4 c; uniform sampler2D map; uniform vec4 yf, tf; void main(){ if (vT < -.5) discard; if (vT > .5) { vec4 t = texture(map, vE); vec3 l = t.rgb; c = vec4(yf.rgb * l * t.a * yf.a, t.a * yf.a); } else c = vec4(tf.rgb, 1.); }' });
    const me = new THREE.Mesh(g, m); me.frustumCulled = false; sc.add(me); }
  const top = new Float32Array(4 * N * N), buf = new Float32Array(4 * N * N); const K = 4;
  for (let a = 0; a < K; a++) for (let b = 0; b < K; b++) {
    jit.value.set(((a + 0.5) / K - 0.5) * 2 / N, ((b + 0.5) / K - 0.5) * 2 / N);
    r.setRenderTarget(rt); r.setClearColor(0x000000, 0); r.clear(); r.render(sc, new THREE.Camera()); r.readRenderTargetPixels(rt, 0, 0, N, N, buf);
    for (let i = 0; i < buf.length; i++) top[i] += buf[i] / (K * K);
  }
  r.setRenderTarget(null); rt.dispose();
  const cv = document.createElement('canvas'); cv.width = cv.height = N; const gx = cv.getContext('2d'); const rgb = gx.createImageData(N, N), al = gx.createImageData(N, N);
  const srgb = x => { x = Math.min(1, Math.max(0, x)); return Math.round(255 * (x <= 0.0031308 ? 12.92 * x : 1.055 * x ** (1 / 2.4) - 0.055)); };
  let dolu = 0;
  for (let t = 0; t < N * N; t++) { const o = 4 * t, A = top[o + 3]; rgb.data[o + 3] = al.data[o + 3] = 255;
    if (A > 1e-4) { dolu++; for (let c = 0; c < 3; c++) rgb.data[o + c] = srgb(top[o + c] / A); al.data[o] = al.data[o + 1] = al.data[o + 2] = Math.round(255 * Math.min(1, A)); } }
  gx.putImageData(rgb, 0, 0); const r1 = cv.toDataURL('image/png'); gx.putImageData(al, 0, 0); const r2 = cv.toDataURL('image/png');
  return { rgb: r1, alfa: r2, texel: dolu, kose, eslesmeyen, en_uzak_m: +enUzak.toFixed(4) };
};
// Ölçüm hedefi: bütün modelin (Harita_Golge hariç) kutu ortası, yüksekliğin %35'i; glTF yerel koordinatı (uygulama() ofseti kendisi ekler)
window.kutu = async ({ ref }) => { const m = await yukle(ref); m.updateMatrixWorld(true); const b = new THREE.Box3();
  m.traverse(o => { if (o.isMesh && o.name !== 'Harita_Golge') b.expandByObject(o); }); const c = b.getCenter(new THREE.Vector3());
  return [c.x, b.min.y + 0.35 * (b.max.y - b.min.y), c.z]; };
window.hazir = true;
