<!-- temalar: asıl tema buzlu (varsayılan, 30 Ekim 2026) | cam (+ deneme: sicak | il | bant), ?tema=sade kapatır; seçim cihazda kalır (akar.tema). Kurallar temalar.css'te. -->
<script>try{/* tema: [tarayıcı çubuğu rengi, temanın varsayılan harita kartı] */
const T={buzlu:['#EDEEEA','buzlu'],sicak:['#F2EEE7','buzlu'],il:['#F2EEE7','buzlu'],bant:['#2E2620','buzlu'],cam:['#12171B','cam']};   /* sicak | il | bant = buzlu + ton (data-ton), şehre göre deneme */const L=localStorage,U=new URLSearchParams(location.search);
const q=U.get('tema');if(q)L.setItem('akar.tema',q);const sec=q||L.getItem('akar.tema')||'buzlu';const t=T[sec]?sec:null;   /* 30 Ekim 2026: asıl tema buzlu (varsayılan); ?tema=sade eski sade görünümü açar */
/* harita kartı seçeneği: ?kart=cam | perde | buzlu | yok (cihazda kalır: akar.kart); seçilmemişse temanınki */
const k=U.get('kart');if(k)L.setItem('akar.kart',k);const kk=k||L.getItem('akar.kart')||(t&&T[t][1]);
if(['cam','perde','buzlu'].includes(kk))document.documentElement.dataset.kart=kk;
if(t){const ton=['sicak','il','bant'].includes(t);document.documentElement.dataset.tema=ton?'buzlu':t;if(ton)document.documentElement.dataset.ton=t;document.querySelector('meta[name=theme-color]').content=T[t][0]}}catch(e){}</script>
