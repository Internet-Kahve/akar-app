<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F5">
<title>AKAR · Bursa</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- masaüstü üst çubuk -->
  <header id="ust" class="masaustu">
    <a class="logo" href="#/">AKAR</a>
    <label class="arama"><span data-ic="search"></span><input id="arama-d" type="search" placeholder="Eser, şehir veya rota ara" autocomplete="off"><span class="sehir">Bursa</span></label>
    <span class="avatar">MT</span>
  </header>

  <!-- masaüstü sol panel -->
  <aside id="panel" class="masaustu" aria-label="Panel"><div id="panel-ic"></div>
    <button id="panel-sekme" aria-label="Paneli kapat" title="Paneli kapat"><span data-ic="chevron-left" data-boy="16"></span></button>
  </aside>

  <main id="sahne">
    <div id="harita" aria-label="Harita"></div>

    <!-- mobil arama + çipler -->
    <div id="harita-ust">
      <label class="arama mobil"><span data-ic="search"></span><input id="arama-m" type="search" placeholder="Eser, şehir veya rota ara" autocomplete="off"><span class="avatar">MT</span></label>
      <div class="cipler" id="cipler"></div>
    </div>

    <div id="harita-kontrol">
      <button class="daire" id="b-3d" aria-label="2D / 3D"><span class="k">K</span><b>3D</b></button>
      <div class="zoom"><button id="b-yakin" aria-label="Yakınlaştır"><span data-ic="plus"></span></button><button id="b-uzak" aria-label="Uzaklaştır"><span data-ic="minus"></span></button></div>
      <button class="daire kucuk" id="b-konum" aria-label="Konumuma git"><span data-ic="locate-fixed"></span></button>
    </div>

    <!-- eser detay / anlatım görünümü (masaüstünde sağ alan, mobilde tam ekran) -->
    <section id="gorus" hidden></section>
    <div id="eser-pop" class="masaustu" hidden></div>
  </main>

  <!-- mobil alt sayfa ve eser kartı -->
  <section id="alt" class="mobil-k" aria-label="Eserler ve rotalar"><div class="tutamak" id="alt-tutamak"><i></i></div><div id="alt-ic"></div></section>
  <section id="eser-kart" class="mobil-k" hidden></section>

  <div id="toast" role="status" hidden></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="app.js"></script>
</body>
</html>
