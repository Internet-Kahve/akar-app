name: API CI

on:
  push:
    branches: [main]
    paths: ["services/api/**", "packages/domain/**", "package-lock.json", ".github/workflows/api-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["services/api/**", "packages/domain/**", "package-lock.json", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @akar/api
      # Testcontainers starts PostGIS through the runner's Docker daemon.
      - run: npm test -w @akar/api
      - name: OpenAPI spec is committed and current
        run: npm run openapi -w @akar/api && git diff --exit-code docs/api/openapi.json
