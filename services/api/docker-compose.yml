services:
  db:
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: akar
      POSTGRES_PASSWORD: akar
      POSTGRES_DB: akar
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - akar-db:/var/lib/postgresql/data
    healthcheck:
      # The initialization server accepts Unix sockets before init scripts finish.
      # TCP is available only after the final server starts, ready for migrations.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U akar -d akar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  akar-db:
